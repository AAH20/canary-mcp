[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-mcp"
version = "1.0.0"
description = "Active Deception Technology & Honeypot Tripwires for Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ahmed Hassan"}
]
keywords = [
    "model-context-protocol",
    "mcp",
    "prompt-injection",
    "cybersecurity",
    "honeypot",
    "canary-tokens",
    "deception-technology",
    "ai-security"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
canary-mcp = "canary_mcp.cli:main"
